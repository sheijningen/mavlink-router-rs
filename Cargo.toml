[package]
name = "rmr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Stefan Alexander van Heijningen"]
license = "Apache-2.0"
description = "Rust MAVLink Router — transparent MAVLink forwarder"
repository = "https://github.com/sheijningen/mavlink-router-rs"
readme = "README.md"
keywords = ["mavlink", "router", "drone", "uav", "telemetry"]
categories = ["command-line-utilities", "network-programming", "aerospace::drones"]
publish = false

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "io-util",
    "io-std",
    "time",
    "sync",
] }
tokio-util = "0.7"
tokio-serial = "5.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "2"
bytes = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
socket2 = { version = "0.5", features = ["all"] }
crossbeam-queue = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
strsim = "0.11"

[build-dependencies]
quick-xml = "0.36"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
rstest = { version = "0.23", default-features = false }

[profile.release]
lto = "thin"

[lints.clippy]
all = { level = "deny", priority = -1 }
len_without_is_empty = "allow"
