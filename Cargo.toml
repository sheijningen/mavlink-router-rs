[package]
name = "rmr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust MAVLink Router — transparent, dialect-agnostic forwarder of MAVLink frames"
repository = "https://github.com/sheijningen/rmr"

[lib]
name = "rmr"
path = "src/lib.rs"

[[bin]]
name = "rmr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
bytes = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
smallvec = "1"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-queue = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }

[build-dependencies]
quick-xml = "0.36"

[dev-dependencies]
proptest = "1"

[features]
default = []
serial_hw = []

# Temporary: phases 0-6 introduce code ahead of its callers. Remove after phase 7.
[lints.rust]
dead_code = "allow"
