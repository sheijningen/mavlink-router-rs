# Drone-side companion computer hosting three on-board microservices,
# each on its own loopback UDP endpoint.
#
#   ┌────────────────── Drone ──────────────────┐
#   │                              ┌──────┐     │
#   │  FC (UART)         ◄───────► │      │     │
#   │                              │      │◄────┼───────────────────► GCS
#   │  radio-monitor     ◄───────► │ RMR  │     │
#   │                              │      │     │
#   │  obstacle-avoidance ◄──────► │      │     │
#   │                              │      │     │
#   │  camera            ◄───────► │      │     │
#   │                              └──────┘     │
#   └───────────────────────────────────────────┘

# Flight controller.
[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 115200

# GCS. The obstacle-avoidance service is on-board only.
[[endpoints]]
type = "udpc"
name = "gcs"
host = "10.223.0.10"
port = 14550
block_src_endpoint_out = "obstacle-avoidance"

# Radio link quality telemetry.
[[endpoints]]
type = "udps"
name = "radio-monitor"
bind = "127.0.0.1:14551"
allow_msgid_in = "109"  # RADIO_STATUS

# Obstacle-avoidance sensor telemetry.
[[endpoints]]
type = "udps"
name = "obstacle-avoidance"
bind = "127.0.0.1:14552"
allow_msgid_in = "330"  # OBSTACLE_DISTANCE

# Camera status telemetry.
[[endpoints]]
type = "udps"
name = "camera"
bind = "127.0.0.1:14553"
allow_msgid_in = "259-263"  # CAMERA_INFORMATION, CAMERA_SETTINGS,
                            # STORAGE_INFORMATION, CAMERA_CAPTURE_STATUS,
                            # CAMERA_IMAGE_CAPTURED

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:115200#fc \
#     udpc:10.223.0.10:14550#gcs?block_src_endpoint_out=obstacle-avoidance \
#     udps:127.0.0.1:14551#radio-monitor?allow_msgid_in=109 \
#     udps:127.0.0.1:14552#obstacle-avoidance?allow_msgid_in=330 \
#     udps:127.0.0.1:14553#camera?allow_msgid_in=259-263
