# Three drones (sysids 1, 2, 3), one GCS at sysid 255.
# Stops broadcast telemetry from sibling drones leaking onto another
# drone's uplink.
#
#   ┌── Drone 1 ──┐                       ┌──────── Ground ─────────────┐
#   │             │                       │   ┌──────┐                  │
#   │             │◄──────────────────────┼──►│      │                  │
#   └─────────────┘                       │   │      │                  │
#   ┌── Drone 2 ──┐                       │   │      │                  │
#   │             │                       │   │ RMR  │◄────► GCS        │
#   │             │◄──────────────────────┼──►│      │                  │
#   └─────────────┘                       │   │      │                  │
#   ┌── Drone 3 ──┐                       │   │      │                  │
#   │             │                       │   │      │                  │
#   │             │◄──────────────────────┼──►│      │                  │
#   └─────────────┘                       │   └──────┘                  │
#                                         └─────────────────────────────┘

# Uplink to drone 1.
[[endpoints]]
type = "udpc"
name = "drone1"
host = "192.168.1.11"
port = 14550
allow_src_sys_out = "255"

# Uplink to drone 2.
[[endpoints]]
type = "udpc"
name = "drone2"
host = "192.168.1.12"
port = 14550
allow_src_sys_out = "255"

# Uplink to drone 3.
[[endpoints]]
type = "udpc"
name = "drone3"
host = "192.168.1.13"
port = 14550
allow_src_sys_out = "255"

# GCS over TCP.
[[endpoints]]
type = "tcps"
name = "gcs"
bind = "0.0.0.0:5760"

# Equivalent CLI invocation:
#
# rmr udpc:192.168.1.11:14550#drone1?allow_src_sys_out=255 \
#     udpc:192.168.1.12:14550#drone2?allow_src_sys_out=255 \
#     udpc:192.168.1.13:14550#drone3?allow_src_sys_out=255 \
#     tcps:0.0.0.0:5760#gcs
