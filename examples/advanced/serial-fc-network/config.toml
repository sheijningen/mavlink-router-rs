# Advanced example: expose a serial-attached flight controller to the
# network — the "hello world" of multi-endpoint RMR
#
# Topology:
#
#                ┌──────────────┐
#   FC (UART) ─► │              │ ─► GCS over TCP
#                │     RMR      │
#                │              │ ─► many GCSs / loggers over UDP
#                └──────────────┘
#
# Everything the FC produces is routed to both network legs (subject to
# learn-table targeting); commands from either network leg reach the
# FC. No filters — open the gates and let the routing table do the
# work.
#
# Why this is the canonical starting point:
#   - One leg per common GCS transport (TCP for QGC / Mission Planner
#     over a stable LAN, UDP for many-peer setups).
#   - Demonstrates `tcps:` and `udps:` running concurrently on one
#     process without colliding (different ports).
#   - Loop-prevention is automatic: a frame the GCS sends in on `tcps:`
#     reaches the FC, the FC replies, and the reply does NOT go back
#     to the GCS as if it were a third-party frame — the FC's
#     `(sysid, compid)` is in the GCS endpoint's learn-set, so the
#     reply is *only* forwarded out the FC's targeted destinations.

[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 921600

[[endpoints]]
type = "tcps"
name = "gcs-tcp"
bind = "[::]:5760"

[[endpoints]]
type = "udps"
name = "gcs-udp"
bind = "[::]:14550"

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:921600#fc \
#     tcps:[::]:5760#gcs-tcp \
#     udps:[::]:14550#gcs-udp
