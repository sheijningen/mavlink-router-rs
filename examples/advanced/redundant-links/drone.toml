# Paired RMR for redundant uplinks — DRONE side.
#
# Two parallel uplinks (LTE over UDP, RFD900 over serial) carry every
# frame in both directions. The drone-side RMR fans each FC frame across
# both links; the ground-side RMR dedups whichever copy arrives second.
# Same in reverse for GCS commands.
#
#   ┌────────── Drone ───────────┐                ┌────────── Ground ───────────┐
#   │                 ┌──────┐   │                │   ┌──────┐                  │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │ FC (UART) ◄───► │ RMR  │   │                │   │ RMR  │ ◄───► GCS        │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │                 └──────┘   │                │   └──────┘                  │
#   └────────────────────────────┘                └─────────────────────────────┘
#
# Both LTE and RFD900 are in `group = "links"`. Endpoints sharing the
# same group act as one logical link for routing — a device that
# appears on either endpoint is considered reachable via both.

# Global `dedup_ms = 250`: if an identical frame arrives within 250 ms
# of a previous one, the duplicate is dropped. Prevents GCS commands
# from arriving twice to the FC. Increase if more significant latency
# differences between links are expected.
dedup_ms = 250

# Flight controller.
[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 115200

# LTE uplink.
[[endpoints]]
type = "udpc"
name = "lte"
host = "203.0.113.10"
port = 14550
group = "links"

# RFD900 telemetry radio.
[[endpoints]]
type = "serial"
name = "rfd900"
path = "/dev/serial0"
baud = 57600
group = "links"

# Equivalent CLI invocation:
#
# rmr --dedup-ms 250 \
#     serial:/dev/ttyACM0:115200#fc \
#     udpc:203.0.113.10:14550#lte?group=links \
#     serial:/dev/serial0:57600#rfd900?group=links
