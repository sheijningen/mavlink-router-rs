# Paired RMR for redundant uplinks — DRONE side.
#
# Two parallel uplinks (LTE over UDP, RFD900 over serial) carry all
# traffic in both directions. The drone-side RMR fans each FC message
# across both links; the ground-side RMR dedups whichever copy arrives
# second. Same in reverse for GCS commands.
#
#   ┌────────── Drone ───────────┐                ┌────────── Ground ───────────┐
#   │                 ┌──────┐   │                │   ┌──────┐                  │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │ FC (UART) ◄───► │ RMR  │   │                │   │ RMR  │ ◄───► GCS        │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │                 └──────┘   │                │   └──────┘                  │
#   └────────────────────────────┘                └─────────────────────────────┘
#
# Both LTE and RFD900 are in `group = "links"`. Endpoints sharing the
# same group act as one logical link for routing — a device that
# appears on either endpoint is considered reachable via both.

# Global `dedup_ms = 2000`: if an identical message arrives within 2000
# ms of a previous one, the duplicate is dropped. Prevents GCS commands
# from arriving twice to the FC. Err on the high side — undersizing
# silently misses duplicates, oversizing is essentially free.
dedup_ms = 2000

# Flight controller.
[endpoint.fc]
type = "serial"
path = "/dev/ttyACM0"
baud = 115200

# LTE uplink.
[endpoint.lte]
type = "udpc"
host = "203.0.113.10"
port = 14550
group = "links"

# RFD900 telemetry radio.
[endpoint.rfd900]
type = "serial"
path = "/dev/serial0"
baud = 57600
group = "links"

# Equivalent CLI invocation:
#
# rmr --dedup-ms 2000 \
#     serial:/dev/ttyACM0:115200#fc \
#     udpc:203.0.113.10:14550#lte?group=links \
#     serial:/dev/serial0:57600#rfd900?group=links
