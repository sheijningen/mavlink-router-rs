# Paired RMR for redundant uplinks — GROUND side.
#
# Two parallel uplinks (LTE over UDP, RFD900 over serial) carry all
# traffic in both directions. The ground-side RMR fans each GCS command
# across both links; the drone-side RMR dedups whichever copy arrives
# second. Same in reverse for FC telemetry.
#
#   ┌────────── Drone ───────────┐                ┌────────── Ground ───────────┐
#   │                 ┌──────┐   │                │   ┌──────┐                  │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │ FC (UART) ◄───► │ RMR  │   │                │   │ RMR  │ ◄───► GCS        │
#   │                 │      │◄──┼────────────────┼──►│      │                  │
#   │                 └──────┘   │                │   └──────┘                  │
#   └────────────────────────────┘                └─────────────────────────────┘
#
# Both LTE and RFD900 are in `group = "links"`. Endpoints sharing
# the same group act as one logical link for routing — a device that
# appears on either endpoint is considered reachable via both.

# Global `dedup_ms = 2000`: if an identical message arrives within 2000
# ms of a previous one, the duplicate is dropped. Prevents FC telemetry
# from arriving twice to the GCS. Err on the high side — undersizing
# silently misses duplicates, oversizing is essentially free.
dedup_ms = 2000

# LTE downlink.
[[endpoints]]
type = "udps"
name = "lte"
bind = "0.0.0.0:14550"
group = "links"

# RFD900 telemetry radio on a USB-serial dongle.
[[endpoints]]
type = "serial"
name = "rfd900"
path = "/dev/ttyUSB0"
baud = 57600
group = "links"

# GCS.
[[endpoints]]
type = "tcps"
name = "gcs"
bind = "0.0.0.0:5760"

# Equivalent CLI invocation:
#
# rmr --dedup-ms 2000 \
#     udps:0.0.0.0:14550#lte?group=links \
#     serial:/dev/ttyUSB0:57600#rfd900?group=links \
#     tcps:0.0.0.0:5760#gcs
