# Advanced example: a sniffer endpoint as a diagnostic tap
#
# Sniffer mode (`?sniffer=true`) turns an endpoint into a one-way
# diagnostic tap. The sniffer **receives every frame the router
# accepted** — regardless of `target_system`, regardless of whether
# the frame's `(sysid, compid)` is in the sniffer's learn-set, and
# regardless of any `*_out` filters on the sniffer endpoint. The
# sniffer endpoint is allowed to inject frames in the other direction
# (its inbound side runs the normal ingress pipeline), but most taps
# are configured to never inject — the example below also sets
# `block_src_sys_in = "0-255"` to make the tap strictly receive-only.
#
# What a sniffer is for:
#   - Live `tcpdump`-style observation: connect Wireshark with the
#     MAVLink dissector or just stream into a `.tlog` recorder.
#   - Debugging a deployment without disturbing routing.
#
# What a sniffer is NOT for:
#   - Bypassing dedup. Sniffers see **post-dedup** traffic — the same
#     frame set the router accepted for routing. If you need
#     pre-dedup observation, disable dedup globally (`--dedup-ms 0`,
#     the default) or use a passive packet capture outside RMR.
#   - Wire-level glitches. CRC-failed frames are dropped at ingress,
#     so a sniffer downstream of the router never sees them. Capture
#     at the link layer if you need that.

[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 921600

[[endpoints]]
type = "tcps"
name = "gcs"
bind = "[::]:5760"

[[endpoints]]
type = "tcps"
name = "tap"
bind = "[::]:5763"
sniffer = true
block_src_sys_in = "0-255"

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:921600#fc \
#     tcps:[::]:5760#gcs \
#     tcps:[::]:5763#tap?sniffer=true&block_src_sys_in=0-255
