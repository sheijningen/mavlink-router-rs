# Ground-side RMR with two local services: an ADS-B feed publishing
# ADSB_VEHICLE traffic to the GCS, and a tracking antenna controller.
# Both are local-only and must never reach the drone, so the uplink
# blocks them by endpoint name.
#
#   ┌── Drone ──┐                ┌─────────────────────────── Ground ────────────────────────────┐
#   │           │                │                                                               │
#   │           │                │                              ┌──────┐                         │
#   │           │◄───────────────┼─────────────────────────────►│      │                         │
#   │           │                │                              │      │                         │
#   └───────────┘                │   ADS-B feed       ◄───────► │ RMR  │ ◄───► GCS               │
#                                │                              │      │                         │
#                                │   tracking antenna ◄───────► │      │                         │
#                                │                              └──────┘                         │
#                                └───────────────────────────────────────────────────────────────┘

# Uplink to the drone over UDP. Block the local-only services.
[endpoint.radio]
type = "udpc"
host = "192.168.10.20"
port = 14550
block_src_endpoint_out = "adsb,tracker"

# GCS on the local LAN.
[endpoint.gcs]
type = "tcps"
bind = "0.0.0.0:5760"

# Local ADS-B feed.
[endpoint.adsb]
type = "udps"
bind = "127.0.0.1:14555"
allow_msgid_in = "246"  # ADSB_VEHICLE
allow_src_comp_in = "156"  # MAV_COMP_ID_ADSB

# Tracking antenna controller.
[endpoint.tracker]
type = "udps"
bind = "127.0.0.1:14556"
allow_msgid_in = "30"  # ATTITUDE
allow_msgid_out = "33"  # GLOBAL_POSITION_INT

# Equivalent CLI invocation:
#
# rmr udpc:192.168.10.20:14550#radio?block_src_endpoint_out=adsb,tracker \
#     tcps:0.0.0.0:5760#gcs \
#     udps:127.0.0.1:14555#adsb?allow_msgid_in=246&allow_src_comp_in=156 \
#     udps:127.0.0.1:14556#tracker?allow_msgid_in=30&allow_msgid_out=33
