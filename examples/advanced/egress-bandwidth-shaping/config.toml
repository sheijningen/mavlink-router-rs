# Drone-side RMR exposing two outbound links with different policies.
# The GCS receives full telemetry minus a handful of raw sensor
# msgids it never plots. A second endpoint serves non-GCS consumers
# (status UIs, dashboard widgets, indicator panels) that want a curated
# slice of high-level drone state: liveness, attitude, position, speed,
# and battery — and nothing else.
#
#   ┌────────── Drone ───────────┐
#   │                 ┌──────┐   │
#   │                 │      │◄──┼───────────────────► GCS
#   │ FC (UART) ◄───► │ RMR  │   │
#   │                 │      │◄──┼───────────────────► Status channel
#   │                 └──────┘   │
#   └────────────────────────────┘

# Flight controller.
[endpoint.fc]
type = "serial"
path = "/dev/ttyACM0"
baud = 115200

# GCS. Gets all but raw sensor data.
[endpoint.gcs]
type = "udpc"
host = "10.223.0.10"
port = 14550
block_msgid_out = "27,28,105,116,129"  # RAW_IMU, RAW_PRESSURE, HIGHRES_IMU, SCALED_IMU2, SCALED_IMU3

# Status channel. Non-GCS consumers subscribe for high-level state.
[endpoint.status]
type = "udps"
bind = "0.0.0.0:14552"
allow_msgid_out = "0,1,30,33,74,147,245,253"  # HEARTBEAT, SYS_STATUS, ATTITUDE, GLOBAL_POSITION_INT,
                                              # VFR_HUD, BATTERY_STATUS, EXTENDED_SYS_STATE, STATUSTEXT

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:115200#fc \
#     udpc:10.223.0.10:14550#gcs?block_msgid_out=27,28,105,116,129 \
#     udps:0.0.0.0:14552#status?allow_msgid_out=0,1,30,33,74,147,245,253
