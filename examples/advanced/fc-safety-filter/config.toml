# Filter out all stick-injection msgids to the FC.
# This setup assumes the FC has its own RC receiver.
#
#   ┌────────── Drone ───────────┐
#   │                 ┌──────┐   │
#   │ FC (UART) ◄───► │ RMR  │◄──┼───────────────────► GCS
#   │                 └──────┘   │
#   └────────────────────────────┘

# Flight controller. Block stick-injection msgids so nothing
# arriving from the network can overwrite the RC controller.
[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 115200
block_msgid_out = "69,70"  # MANUAL_CONTROL, RC_CHANNELS_OVERRIDE

# GCS.
[[endpoints]]
type = "udpc"
name = "gcs"
host = "10.223.0.10"
port = 14550

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:115200#fc?block_msgid_out=69,70 \
#     udpc:10.223.0.10:14550#gcs
