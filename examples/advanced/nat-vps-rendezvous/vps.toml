# Advanced example: NAT traversal via VPS rendezvous — VPS side
#
# Companion file to vehicle.toml. See vehicle.toml for the full
# topology diagram.
#
# This RMR runs on a publicly-reachable VPS (cheap small instance is
# fine — RMR's resource footprint is tiny). Two `tcps:` listeners on
# different ports:
#
#   :5760 — accepts the inbound TCP connection the vehicle dials.
#   :5761 — accepts the inbound TCP connection from one or more GCSs.
#
# RMR routes frames between the two ports using the same learn-table-
# driven dispatch as any other RMR deployment. Per-child routing means
# multiple GCSs can connect to :5761 simultaneously (each gets its
# own learn-set, its own loop-prevention scope, its own stats line);
# they all see the vehicle's broadcast frames and the vehicle sees
# their targeted commands.
#
# Hardening notes (out of scope for the runnable example):
#   - Front this with `iptables` / firewall rules limiting :5760 to
#     known vehicle source ranges and :5761 to operator workstations.
#   - Or run a stunnel / WireGuard / SSH-tunnel in front so the wire
#     traffic is encrypted (RMR forwards opaque bytes; v2 signing is
#     pass-through, so authenticate the transport, not the payload).

[[endpoints]]
type = "tcps"
name = "vehicle-in"
bind = "[::]:5760"

[[endpoints]]
type = "tcps"
name = "gcs-in"
bind = "[::]:5761"

# Equivalent CLI invocation:
#
# rmr tcps:[::]:5760#vehicle-in tcps:[::]:5761#gcs-in
