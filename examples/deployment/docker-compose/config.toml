# Minimal drone-side deployment for the docker-compose example
#
#   ┌──────── Drone ────────┐
#   │  FC (UART) ◄─► ┌─────┐│
#   │                │ RMR │┼──► GCS
#   │                └─────┘│
#   └───────────────────────┘

[endpoint.fc]
type = "serial"
path = "/dev/ttyAMA0"
baud = 115200

[endpoint.gcs]
type = "udpc"
host = "10.223.0.10"
port = 14550

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyAMA0:115200#fc \
#     udpc:10.223.0.10:14550#gcs
