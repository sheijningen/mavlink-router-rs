# Simple example: UDP client with reply-source latching
#
# `udpc:` is RMR's outbound UDP scheme. It sends first to a configured
# `host:port`, then *latches* its destination onto wherever the first
# matching inbound reply comes from. That handles the common case where
# a GCS responds from an ephemeral source port that differs from the
# port RMR was originally pointed at.
#
# **Latch is IP-scoped, not port-scoped.** Only inbound packets whose
# source IP matches the resolved configured-host's IP cause the latch
# to update. Port may differ — that's the point — but packets from any
# other IP are dropped at ingress and counted in `in_filter_drops`.
# Prevents accidental cross-talk on shared networks.
#
# **DNS re-resolution** happens in two cases:
#   - on a `send_to` error (host moved, network changed, the resolver
#     handed out a stale answer)
#   - on `latch_idle_secs` of silence from the latched peer, when the
#     destination reverts to the configured `host:port` before the next
#     send burst
#
# `latch_idle_secs` (default 30 s) is the silence threshold above. A
# GCS that crashes and restarts on a fresh ephemeral port within ~30 s
# will be picked up by the next reply; longer silences cause a revert,
# which gives the operator a chance to recover by typing the configured
# address into a new GCS instance.

[[endpoints]]
type = "udpc"
name = "gcs"
host = "gcs.local"
port = 14550
latch_idle_secs = 30

# Equivalent CLI invocation:
#
# rmr udpc:gcs.local:14550#gcs?latch_idle_secs=30
