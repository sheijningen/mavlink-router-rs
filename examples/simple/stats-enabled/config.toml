# Simple example: enable per-endpoint stats output
#
# RMR exposes per-endpoint counters as JSON-Lines on **stdout**, one
# object per endpoint per period. Logs go to **stderr** — the two
# streams never interleave. This is the right wire format for piping
# into a log aggregator, a CSV converter, or a quick `jq` filter at
# the terminal.
#
# Globals:
#   stats                = true   # turn the periodic dump on
#   stats_interval_secs  = 5      # period in seconds (default 5)
#
# Two stats-line shapes:
#
#   Parent listeners (`tcps:`, `udps:`) — emit only `ts`, `endpoint`,
#   `state`. No counters: no frames traverse the parent itself.
#
#     {"ts":"2026-05-22T10:00:05Z","endpoint":"gcs","state":"connected"}
#
#   Routable endpoints (`tcpc:`, `udpc:`, `serial:`, learned UDP peers,
#   accepted TCP clients) — emit the full counter schema.
#
#     {"ts":"2026-05-22T10:00:05Z","endpoint":"vehicle","state":"connected",
#      "rx_frames":1240,"tx_frames":1235,"rx_bytes":289120,"tx_bytes":288960,
#      "dropped_tx":0,"crc_errors":2,"resync_bytes":7,"rx_lost_est":3,
#      "in_filter_drops":0,"out_filter_drops":1,"dedup_drops":15,
#      "learn_entries":4}
#
# Counters are cumulative-since-start; consumers compute deltas. Three
# fields are worth special operator attention:
#   - `dropped_tx`  — writer fell behind, oldest frame evicted; a slow
#                     consumer or a flapping link
#   - `crc_errors`  — frame corruption at ingress; link quality
#   - `rx_lost_est` — gaps in MAVLink seq numbers per (sysid, compid);
#                     a best-effort indicator of upstream packet loss

stats = true
stats_interval_secs = 5

[[endpoints]]
type = "udps"
name = "bus"
bind = "[::]:14550"

[[endpoints]]
type = "tcpc"
name = "vehicle"
host = "companion.local"
port = 5760

# Equivalent CLI invocation:
#
# rmr --stats --stats-interval-secs 5 \
#     udps:[::]:14550#bus tcpc:companion.local:5760#vehicle
