# IPv6 and DNS-hostname addressing. Exposes the FC in three ways, each
# exercising a different address form RMR's scheme parsers accept.
#
#   ┌────────── Drone ──────────┐
#   │                ┌──────┐   │
#   │                │      │◄──┼──► ad-hoc UDP bus
#   │ FC (UART) ◄───►│ RMR  │◄──┼──► IPv6 TCP peer
#   │                │      │◄──┼──► DNS-resolved TCP peer
#   │                └──────┘   │
#   └───────────────────────────┘

# Flight controller over UART.
[[endpoints]]
type = "serial"
name = "fc"
path = "/dev/ttyACM0"
baud = 115200

# Dual-stack UDP listener — accepts both v4 and v6 peers on one socket.
# RMR forces `IPV6_V6ONLY=0` on both Linux and Windows when binding `[::]`,
# so the dual-stack behaviour is identical on both platforms.
[[endpoints]]
type = "udps"
name = "bus"
bind = "[::]:14550"

# TCP client to an IPv6 address. In TOML the host is unbracketed
# (`host = "2001:db8::1"`); on the CLI brackets are required.
[[endpoints]]
type = "tcpc"
name = "peer-v6"
host = "2001:db8::1"
port = 5760

# TCP client to a hostname. RMR re-resolves DNS on every reconnect, so
# the endpoint survives dynamic DNS / k8s service migration / VPN
# routing changes without restart.
[[endpoints]]
type = "tcpc"
name = "peer-hostname"
host = "vehicle.example.com"
port = 5760

# Equivalent CLI invocation:
#
# rmr serial:/dev/ttyACM0:115200#fc \
#     udps:[::]:14550#bus \
#     tcpc:[2001:db8::1]:5760#peer-v6 \
#     tcpc:vehicle.example.com:5760#peer-hostname
