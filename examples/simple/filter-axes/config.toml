# Side-by-side demonstration of the four msgid filter axes
#
# Direction rule. `_in` filters muzzle frames at the source endpoint
# (one drop hides the frame from *every* destination). `_out` filters
# muzzle frames per destination (one drop hides the frame from *that*
# destination only; sibling destinations still receive it).
#
#                                ┌──────┐
#   peer ◄── allow-in (udps) ──► │      │ ◄── allow-out (udpc) ──► peer
#                                │ RMR  │
#   peer ◄── block-in (udps) ──► │      │ ◄── block-out (udpc) ──► peer
#                                └──────┘

# ALLOWLIST on ingress. Only HEARTBEAT may enter the router from
# this endpoint. Every other msgid arriving on this endpoint is dropped.
[endpoint.allow-in]
type = "udps"
bind = "0.0.0.0:14550"
allow_msgid_in = "0"  # HEARTBEAT

# BLOCKLIST on ingress. TIMESYNC may not enter the router from
# this endpoint. Every other msgid arriving on this endpoint is forwarded.
[endpoint.block-in]
type = "udps"
bind = "0.0.0.0:14551"
block_msgid_in = "111"  # TIMESYNC

# ALLOWLIST on egress. Only HEARTBEAT, SYS_STATUS, ATTITUDE, and
# GLOBAL_POSITION_INT may leave the router toward this endpoint.
# Every other msgid leaving toward this endpoint is dropped.
[endpoint.allow-out]
type = "udpc"
host = "192.168.1.10"
port = 14550
allow_msgid_out = "0,1,30,33"  # HEARTBEAT, SYS_STATUS, ATTITUDE, GLOBAL_POSITION_INT

# BLOCKLIST on egress. RAW_IMU and RAW_PRESSURE may not leave the
# router toward this endpoint. Every other msgid leaving toward
# this endpoint is forwarded.
[endpoint.block-out]
type = "udpc"
host = "192.168.1.11"
port = 14550
block_msgid_out = "27,28"  # RAW_IMU, RAW_PRESSURE

# Equivalent CLI invocation:
#
# rmr udps:0.0.0.0:14550#allow-in?allow_msgid_in=0 \
#     udps:0.0.0.0:14551#block-in?block_msgid_in=111 \
#     udpc:192.168.1.10:14550#allow-out?allow_msgid_out=0,1,30,33 \
#     udpc:192.168.1.11:14550#block-out?block_msgid_out=27,28
